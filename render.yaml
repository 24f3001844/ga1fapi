services:
  - type: web
    name: acme-ledger-agent
    env: python
    region: ohio
    plan: free
    buildCommand: "export CARGO_HOME=/tmp/cargo && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
